<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<title>The Suede Studio</title>
<style>
/* Static shell styling only. Everything rendered by JavaScript carries inline
   style= attributes — no CSS variables anywhere in this file. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: #453E33;
  background: #F7F3EC;
}
h1, h2, h3 { font-family: Georgia, serif; font-weight: normal; }

/* Password gate */
#gate {
  position: fixed; inset: 0; background: #F7F3EC;
  display: flex; align-items: center; justify-content: center; z-index: 50;
}
#gate .gate-card {
  width: 340px; padding: 34px 36px 30px;
  background: #EBE4D9; border: 1px solid #DDD3C4; border-radius: 12px;
  text-align: center;
}
#gate h1 {
  font-family: 'Poppins', Arial, sans-serif; font-weight: 700; text-transform: uppercase;
  font-size: 16px; letter-spacing: 0.2em; color: #453E33; margin-bottom: 6px; white-space: nowrap;
}
#gate p { color: #857A69; font-size: 13px; margin-bottom: 18px; }
#gate input {
  width: 100%; padding: 9px 12px; font-family: Arial, sans-serif; font-size: 14px;
  border: 1px solid #C4B8A8; border-radius: 6px; background: #F7F3EC; color: #453E33;
  text-align: center; outline: none;
}
#gate input:focus { border-color: #B8DFFF; }
#gate button {
  margin-top: 12px; width: 100%; padding: 9px 12px; font-family: Arial, sans-serif;
  font-size: 14px; border: none; border-radius: 6px; background: #6E5B44;
  color: #F7F3EC; cursor: pointer;
}
#gate button:hover { background: #5E564A; }
#gate .gate-error { color: #A85560; font-size: 13px; margin-top: 10px; min-height: 18px; margin-bottom: 0; }

/* App shell */
#app { display: none; min-height: 100vh; }
#app.open { display: flex; }
#sidebar {
  width: 216px; flex-shrink: 0; padding: 26px 14px 20px;
  border-right: 1px solid #DDD3C4; background: #F7F3EC;
}
#sidebar .studio-name {
  font-family: 'Poppins', Arial, sans-serif; font-weight: 700; text-transform: uppercase;
  font-size: 12px; letter-spacing: 0.15em; white-space: nowrap; color: #453E33;
  padding: 0 10px 16px; border-bottom: 1px solid #C4B8A8; margin-bottom: 14px;
}
#sidebar a {
  display: block; padding: 7px 10px; margin-bottom: 2px; border-radius: 6px;
  color: #5E564A; text-decoration: none; font-size: 14px;
}
#sidebar a:hover { background: #B8DFFF; color: #453E33; }
#main { flex: 1; padding: 34px 44px 60px; max-width: 1240px; }

/* Task modal (static markup, toggled by JS) */
#modal-backdrop {
  position: fixed; inset: 0; background: #453E33; opacity: 0.35; z-index: 60; display: none;
}
#modal {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 470px; max-height: 90vh; overflow-y: auto; z-index: 61; display: none;
  background: #F7F3EC; border: 1px solid #C4B8A8; border-radius: 12px; padding: 26px 28px 22px;
}
#modal h2 { font-size: 20px; color: #453E33; margin-bottom: 16px; }
#modal label { display: block; font-size: 13px; color: #5E564A; margin: 12px 0 4px; }
#modal input[type="text"], #modal input[type="date"], #modal select, #modal textarea {
  width: 100%; padding: 8px 10px; font-family: Arial, sans-serif; font-size: 14px;
  border: 1px solid #C4B8A8; border-radius: 6px; background: #FFFCF5; color: #453E33; outline: none;
}
#modal input:focus, #modal select:focus, #modal textarea:focus { border-color: #B8DFFF; }
#modal textarea { resize: vertical; min-height: 64px; }
#modal .modal-row { display: flex; gap: 12px; }
#modal .modal-row > div { flex: 1; }
#modal .modal-actions { display: flex; align-items: center; margin-top: 20px; }
#modal .btn-save {
  padding: 9px 18px; font-family: Arial, sans-serif; font-size: 14px; border: none;
  border-radius: 6px; background: #6E5B44; color: #F7F3EC; cursor: pointer;
}
#modal .btn-save:hover { background: #5E564A; }
#modal .btn-cancel {
  padding: 9px 14px; font-family: Arial, sans-serif; font-size: 14px;
  border: 1px solid #C4B8A8; border-radius: 6px; background: #F7F3EC; color: #5E564A;
  cursor: pointer; margin-left: 8px;
}
#modal .btn-cancel:hover { border-color: #857A69; }
#modal .btn-delete {
  margin-left: auto; padding: 9px 4px; font-family: Arial, sans-serif; font-size: 13px;
  border: none; background: none; color: #A85560; cursor: pointer;
}
#modal .btn-delete:hover { text-decoration: underline; }

/* Generic record modal (clients, prospects, content) — body is JS-rendered */
#gmodal {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 620px; max-width: 94vw; max-height: 90vh; overflow-y: auto; z-index: 61; display: none;
  background: #F7F3EC; border: 1px solid #C4B8A8; border-radius: 12px; padding: 26px 28px 22px;
}
#gmodal h2 { font-size: 20px; color: #453E33; margin-bottom: 6px; }
#gmodal .modal-actions { display: flex; align-items: center; margin-top: 20px; }
#gmodal .btn-save {
  padding: 9px 18px; font-family: Arial, sans-serif; font-size: 14px; border: none;
  border-radius: 6px; background: #6E5B44; color: #F7F3EC; cursor: pointer;
}
#gmodal .btn-save:hover { background: #5E564A; }
#gmodal .btn-cancel {
  padding: 9px 14px; font-family: Arial, sans-serif; font-size: 14px;
  border: 1px solid #C4B8A8; border-radius: 6px; background: #F7F3EC; color: #5E564A;
  cursor: pointer; margin-left: 8px;
}
#gmodal .btn-cancel:hover { border-color: #857A69; }
#gmodal .btn-delete {
  margin-left: auto; padding: 9px 4px; font-family: Arial, sans-serif; font-size: 13px;
  border: none; background: none; color: #A85560; cursor: pointer;
}
#gmodal .btn-delete:hover { text-decoration: underline; }
</style>
</head>

/* ─── Storage layer ─────────────────────────────────────────────────────────
   All persistence goes through these two functions and nothing else touches
   localStorage. In a later phase they swap to a Cloudflare Worker backed by
   KV without changing the rest of the file. */
var STORAGE_KEY = 'suede-dashboard-v1';

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveState(s) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  } catch (e) { /* storage full or blocked — keep working in memory */ }
}

      id: 'seed-' + (i + 1),
      title: d[1],
      owner: d[0],
      client: d[4],
      priority: d[2],
      due: d[3],
      notes: d[5],
      status: 'todo',
      doneDate: null
    };
  });
}

var state = loadState();
if (!state || !state.tasks) state = { tasks: seedTasks() };
if (!state.clients) state.clients = [];
if (!state.prospects) state.prospects = [];
if (!state.content) state.content = [];
if (!state.onboardings) state.onboardings = [];
if (!state.selections) state.selections = [];
saveState(state);

/* ─── Helpers ───────────────────────────────────────────────────────────── */
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sept', 'Oct', 'Nov', 'Dec'];
var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtDate(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  return parseInt(p[2], 10) + ' ' + MONTHS[parseInt(p[1], 10) - 1];
}
function weekBounds() {
  var d = new Date();
  var day = d.getDay(); /* Monday-start week */
  var diffToMon = (day === 0 ? -6 : 1 - day);
  var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diffToMon);
  var sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
  function iso(x) {
    return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  }
  return { start: iso(mon), end: iso(sun) };
}
function isOverdue(t) {
  return t.status !== 'done' && t.due && t.due < todayStr();
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/* Per-person tints, from the website's taupes — blue and pink stay reserved
   for the interface accent and overdue states. */
var OWNER_COLORS = {
  Elva:  { chip: '#776D5F', text: '#FAF8F4', wash: '#EAE6E0' },
  Laura: { chip: '#AA9E90', text: '#3E382E', wash: '#F3EFE9' }
};

function findTask(id) {
  for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i];
  return null;
}

/* ─── Small render pieces (all inline styles) ───────────────────────────── */
function priorityTag(p, muted) {
  if (p === 'P1' && !muted) {
    return '<span style="display:inline-block;background:#B8DFFF;color:#453E33;font-size:11px;font-weight:bold;padding:1px 7px;border-radius:9px;font-family:Arial,sans-serif;">P1</span>';
  }
  if (p === 'P2' && !muted) {
    return '<span style="display:inline-block;background:#DDD3C4;color:#5E564A;font-size:11px;padding:1px 7px;border-radius:9px;font-family:Arial,sans-serif;">P2</span>';
  }
  return '<span style="display:inline-block;border:1px solid #C4B8A8;color:#857A69;font-size:11px;padding:0 6px;border-radius:9px;font-family:Arial,sans-serif;">' + esc(p) + '</span>';
}

function ownerDot(owner) {
  return '<span style="color:#5E564A;font-size:12px;">' + esc(owner) + '</span>';
}

function moduleCard(title, bodyHtml) {
  return '<section style="background:#EBE4D9;border:1px solid #DDD3C4;border-radius:10px;padding:18px 20px 14px;">' +
    '<h2 style="font-family:Georgia,serif;font-weight:normal;font-size:17px;color:#453E33;padding-bottom:10px;border-bottom:1px solid #C4B8A8;margin-bottom:4px;">' + title + '</h2>' +
    bodyHtml + '</section>';
}

function emptyLine(text) {
  return '<p style="color:#857A69;font-size:13px;padding:10px 0 4px;">' + text + '</p>';
}

function listRow(t, opts) {
  opts = opts || {};
  var overdue = isOverdue(t);
  var color = overdue ? '#A85560' : '#453E33';
  var dueText = t.due ? (overdue ? 'was due ' + fmtDate(t.due) : 'due ' + fmtDate(t.due)) : '';
  var oc = OWNER_COLORS[t.owner] || { chip: '#DDD3C4', text: '#453E33' };
  return '<div style="display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid #DDD3C4;">' +
    '<span style="flex-shrink:0;min-width:48px;text-align:center;background:' + oc.chip + ';color:' + oc.text + ';font-size:11px;padding:1px 8px;border-radius:9px;">' + esc(t.owner) + '</span>' +
    '<span style="flex:1;color:' + color + ';font-size:13px;">' + esc(t.title) + '</span>' +
    (opts.showPriority ? priorityTag(t.priority) : '') +
    (dueText ? '<span style="flex-shrink:0;color:' + (overdue ? '#A85560' : '#857A69') + ';font-size:12px;">' + dueText + '</span>' : '') +
    '</div>';
}

/* ─── Home page ─────────────────────────────────────────────────────────── */
function renderHome() {
  var now = new Date();
  var dateLine = DAYS[now.getDay()] + ' ' + now.getDate() + ' ' + MONTHS[now.getMonth()];
  var open = state.tasks.filter(function (t) { return t.status !== 'done'; });
  var openElva = open.filter(function (t) { return t.owner === 'Elva'; }).length;
  var openLaura = open.filter(function (t) { return t.owner === 'Laura'; }).length;

  function statCard(value, label, sub) {
    return '<div style="background:#B8DFFF;border-radius:10px;padding:16px 18px 14px;">' +
      '<div style="font-family:Georgia,serif;font-size:32px;line-height:1.15;color:#453E33;">' + value + '</div>' +
      '<div style="font-size:13px;color:#453E33;margin-top:2px;">' + label + '</div>' +
      (sub ? '<div style="font-size:12px;color:#5E564A;margin-top:4px;">' + sub + '</div>' : '') +
      '</div>';
  }

  var liveClients = state.clients.filter(function (c) { return c.stage !== 'Dormant'; });
  var retainers = liveClients.filter(function (c) { return c.retainer; }).length;
  var quietCount = state.prospects.filter(isQuietProspect).length;
  var inPlay = state.prospects.filter(function (p) { return p.status !== 'Won' && p.status !== 'Lost'; }).length;

  var stats =
    '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:22px 0 26px;">' +
    statCard(String(open.length), 'Open tasks', 'Elva ' + openElva + ' · Laura ' + openLaura) +
    statCard('—', 'Hours this month', 'Logging starts with the Hours page') +
    statCard(String(liveClients.length), 'Active clients',
      liveClients.length ? retainers + ' on retainer' : 'Add them on the Clients page') +
    statCard('—', 'Outstanding invoices', 'Comes with the Invoices page') +
    statCard(String(quietCount), 'Follow-ups due',
      inPlay ? inPlay + ' prospects in play' : 'Start the pipeline on the Prospects page') +
    '</div>';

  /* Today and this week — from task due dates */
  var wb = weekBounds();
  var today = todayStr();
  var dueSoon = state.tasks.filter(function (t) {
    return t.status !== 'done' && t.due && (t.due < today || (t.due >= wb.start && t.due <= wb.end));
  });
  dueSoon.sort(function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
  var CAP = 7;
  var weekBody;
  if (dueSoon.length === 0) {
    weekBody = emptyLine('Nothing due this week. Give tasks due dates on the board and they show up here.');
  } else {
    weekBody = dueSoon.slice(0, CAP).map(function (t) { return listRow(t, {}); }).join('');
    if (dueSoon.length > CAP) {
      weekBody += '<p style="color:#857A69;font-size:12px;padding-top:8px;">and ' + (dueSoon.length - CAP) + ' more on the board</p>';
    }
  }

  var p1s = state.tasks.filter(function (t) { return t.status !== 'done' && t.priority === 'P1'; });
  var p1Body;
  if (p1s.length === 0) {
    p1Body = emptyLine('No open P1s. Mark a task P1 on the board and it shows up here.');
  } else {
    p1Body = p1s.slice(0, 6).map(function (t) { return listRow(t, {}); }).join('');
    if (p1s.length > 6) {
      p1Body += '<p style="color:#857A69;font-size:12px;padding-top:8px;">and ' + (p1s.length - 6) + ' more on the board</p>';
    }
  }

  var weekContent = state.content.filter(function (d) {
    return d.date >= wb.start && d.date <= wb.end;
  }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  var contentBody;
  if (weekContent.length === 0) {
    contentBody = emptyLine('Nothing scheduled this week. Add entries on the Content page.');
  } else {
    contentBody = weekContent.slice(0, 7).map(function (d) {
      var noLink = d.date <= today && !d.link && d.status !== 'Posted';
      return '<div style="display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid #DDD3C4;">' +
        '<span style="flex-shrink:0;width:52px;color:#857A69;font-size:12px;">' + fmtDate(d.date) + '</span>' +
        '<span style="flex:1;color:#453E33;font-size:13px;">' + esc(d.client || 'Suede Studio') + ' · ' + esc(d.format || d.platform || 'post') + '</span>' +
        (noLink
          ? '<span style="flex-shrink:0;background:#F2C6CB;color:#A85560;font-size:11px;padding:1px 8px;border-radius:9px;">no link yet</span>'
          : '<span style="flex-shrink:0;color:#857A69;font-size:12px;">' + esc(d.status || '') + '</span>') +
        '</div>';
    }).join('');
    if (weekContent.length > 7) {
      contentBody += '<p style="color:#857A69;font-size:12px;padding-top:8px;">and ' + (weekContent.length - 7) + ' more on the calendar</p>';
    }
  }

  var modules =
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">' +
    moduleCard('Today and this week', weekBody) +
    moduleCard('Top P1 tasks', p1Body) +
    moduleCard('Content going out this week', contentBody) +
    moduleCard('Clients near their hour limit', emptyLine('Hour logging lands with the Hours page — limits get watched from there.')) +
    moduleCard('Overdue invoices', emptyLine('Invoice tracking arrives in a later phase. Nothing owed on record yet.')) +
    '</div>';

  return '<h1 style="font-family:Georgia,serif;font-weight:normal;font-size:28px;color:#453E33;">Where things stand</h1>' +
    '<p style="color:#857A69;font-size:14px;margin-top:2px;">' + dateLine + '</p>' +
    stats + modules;
}

/* ─── Tasks page ────────────────────────────────────────────────────────── */
var COLS = [
  { key: 'todo', label: 'To do' },
  { key: 'doing', label: 'Doing' },
  { key: 'done', label: 'Done' }
];

function taskCard(t) {
  var overdue = isOverdue(t);
  var done = t.status === 'done';
  var wash = (OWNER_COLORS[t.owner] || {}).wash || '#F7F3EC';
  var bg = overdue ? '#F2C6CB' : wash;
  var border = overdue ? '#E3AEB6' : '#DDD3C4';
  var titleColor = overdue ? '#A85560' : (done ? '#857A69' : '#453E33');
  var metaColor = overdue ? '#A85560' : '#857A69';

  var meta = [];
  meta.push(priorityTag(t.priority, done));
  if (t.client) {
    meta.push('<span style="color:' + metaColor + ';font-size:12px;">' + esc(t.client) + '</span>');
  }
  if (done && t.doneDate) {
    meta.push('<span style="color:#857A69;font-size:12px;">done ' + fmtDate(t.doneDate) + '</span>');
  } else if (t.due) {
    meta.push('<span style="color:' + metaColor + ';font-size:12px;">' + (overdue ? 'was due ' : 'due ') + fmtDate(t.due) + '</span>');
  }

  var tick = '';
  if (!done) {
    tick = '<button data-tick="' + esc(t.id) + '" title="Mark done" style="flex-shrink:0;width:20px;height:20px;border-radius:10px;border:1px solid ' + (overdue ? '#A85560' : '#C4B8A8') + ';background:' + bg + ';color:' + (overdue ? '#A85560' : '#857A69') + ';font-size:11px;line-height:1;cursor:pointer;padding:0;font-family:Arial,sans-serif;">✓</button>';
  }

  return '<div draggable="true" data-card="' + esc(t.id) + '" style="background:' + bg + ';border:1px solid ' + border + ';border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:grab;">' +
    '<div style="display:flex;align-items:flex-start;gap:8px;">' +
    '<div style="flex:1;font-size:13px;font-weight:bold;color:' + titleColor + ';">' + esc(t.title) + '</div>' + tick +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;">' + meta.join('') + '</div>' +
    '</div>';
}

var taskFilter = 'All';

function ownerBoard(owner) {
  var ownerTasks = state.tasks.filter(function (t) { return t.owner === owner; });
  var doneCount = ownerTasks.filter(function (t) { return t.status === 'done'; }).length;

  var cols = COLS.map(function (col) {
    var ts = ownerTasks.filter(function (t) { return t.status === col.key; });
    var cards = ts.map(taskCard).join('');
    var hint = '';
    if (ts.length === 0) {
      hint = col.key === 'done'
        ? '<p style="color:#857A69;font-size:12px;margin-top:10px;">Nothing finished yet — drag a task here or tick it off.</p>'
        : '<p style="color:#857A69;font-size:12px;margin-top:10px;">Drag tasks here.</p>';
    }
    return '<div data-colwrap="' + col.key + '" style="background:#EBE4D9;border:1px solid #DDD3C4;border-radius:10px;padding:14px 14px 10px;">' +
      '<div style="font-family:Georgia,serif;font-size:16px;color:#453E33;padding-bottom:8px;border-bottom:1px solid #C4B8A8;">' + col.label +
      '<span style="color:#857A69;font-family:Arial,sans-serif;font-size:12px;"> · ' + ts.length + '</span></div>' +
      hint +
      '<div data-drop data-col="' + col.key + '" data-owner="' + owner + '" style="min-height:40px;border-radius:6px;padding-top:12px;">' + cards + '</div>' +
      '</div>';
  }).join('');

  var dot = (OWNER_COLORS[owner] || {}).chip || '#DDD3C4';
  return '<section style="margin-top:28px;">' +
    '<div style="display:flex;align-items:baseline;gap:10px;">' +
    '<span style="align-self:center;width:13px;height:13px;border-radius:7px;background:' + dot + ';"></span>' +
    '<h2 style="font-family:Georgia,serif;font-weight:normal;font-size:21px;color:#453E33;">' + owner + '</h2>' +
    '<span style="color:#857A69;font-size:13px;">' + doneCount + ' of ' + ownerTasks.length + ' done</span>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px;align-items:start;">' + cols + '</div>' +
    '</section>';
}

function renderTasks() {
  var doneCount = state.tasks.filter(function (t) { return t.status === 'done'; }).length;
  var total = state.tasks.length;
  var pct = total ? Math.round(doneCount / total * 100) : 0;

  var header =
    '<div style="display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;">' +
    '<div style="flex:1;min-width:300px;">' +
    '<h1 style="font-family:Georgia,serif;font-weight:normal;font-size:28px;color:#453E33;">The Suede Studio Task Board</h1>' +
    '<div style="display:flex;align-items:center;gap:10px;margin-top:8px;">' +
    '<div style="width:200px;height:6px;border-radius:3px;background:#DDD3C4;overflow:hidden;"><div style="width:' + pct + '%;height:6px;background:#B8DFFF;"></div></div>' +
    '<span style="color:#857A69;font-size:13px;">' + doneCount + ' of ' + total + ' done</span>' +
    '</div></div>' +
    '<button data-add-task style="padding:9px 18px;font-family:Arial,sans-serif;font-size:14px;border:none;border-radius:6px;background:#6E5B44;color:#F7F3EC;cursor:pointer;">Add a task</button>' +
    '</div>';

  var pills = ['All', 'Elva', 'Laura'].map(function (f) {
    var active = taskFilter === f;
    var activeBg = f === 'All' ? '#B8DFFF' : OWNER_COLORS[f].chip;
    var activeText = f === 'All' ? '#453E33' : OWNER_COLORS[f].text;
    var dot = f === 'All' ? '' :
      '<span style="display:inline-block;width:9px;height:9px;border-radius:5px;background:' + OWNER_COLORS[f].chip + ';margin-right:7px;' +
      (active ? 'border:1px solid ' + activeText + ';' : '') + '"></span>';
    return '<button data-filter="' + f + '" style="padding:6px 18px;font-family:Arial,sans-serif;font-size:13px;' +
      (active ? 'font-weight:bold;' : '') +
      'border:1px solid ' + (active ? activeBg : '#C4B8A8') + ';border-radius:16px;' +
      'background:' + (active ? activeBg : '#F7F3EC') + ';color:' + (active ? activeText : '#5E564A') + ';cursor:pointer;">' +
      dot + (f === 'All' ? 'All tasks' : f) + '</button>';
  }).join('');
  var filterRow = '<div style="display:flex;gap:8px;margin-top:18px;">' + pills + '</div>';

  var boards = taskFilter === 'All'
    ? ownerBoard('Elva') + ownerBoard('Laura')
    : ownerBoard(taskFilter);

  return header + filterRow + boards;
}

/* ─── Clients ───────────────────────────────────────────────────────────── */
var STAGES = ['Onboarding', 'Active', 'In review', 'Delivered', 'Dormant'];
var LANES = ['Content', 'Ecommerce', 'Duo'];
var CHANNELS = ['Cold DM', 'Email', 'Referral', 'Walk-in', 'Enquiry form', 'Instagram'];
var PSTATUSES = ['Reached out', 'Responded', 'Call booked', 'Reach back out', 'Won', 'Lost'];

function isQuietProspect(p) {
  if (p.status === 'Won' || p.status === 'Lost' || !p.lastContact) return false;
  var cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 21);
  var iso = cutoff.getFullYear() + '-' + String(cutoff.getMonth() + 1).padStart(2, '0') + '-' + String(cutoff.getDate()).padStart(2, '0');
  return p.lastContact <= iso;
}

function stageChip(stage) {
  var s = {
    'Onboarding': 'background:#F7F3EC;border:1px solid #C4B8A8;color:#5E564A;',
    'Active': 'background:#B8DFFF;color:#453E33;',
    'In review': 'background:#DDD3C4;color:#5E564A;',
    'Delivered': 'background:#AA9E90;color:#FAF8F4;',
    'Dormant': 'border:1px solid #C4B8A8;color:#857A69;'
  }[stage] || 'border:1px solid #C4B8A8;color:#857A69;';
  return '<span style="display:inline-block;font-size:11px;padding:2px 9px;border-radius:9px;' + s + '">' + esc(stage) + '</span>';
}

function extLink(url, label) {
  var href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
  return '<a href="' + esc(href) + '" target="_blank" rel="noopener" style="color:#6E5B44;font-size:12px;">' + label + '</a>';
}

function renderClients() {
  var header =
    '<div style="display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;">' +
    '<div style="flex:1;min-width:300px;">' +
    '<h1 style="font-family:Georgia,serif;font-weight:normal;font-size:28px;color:#453E33;">Clients</h1>' +
    '<p style="color:#857A69;font-size:14px;margin-top:2px;">Live clients only — prospects have their own page.</p></div>' +
    '<button data-add-client style="padding:9px 18px;font-family:Arial,sans-serif;font-size:14px;border:none;border-radius:6px;background:#6E5B44;color:#F7F3EC;cursor:pointer;">Add a client</button>' +
    '</div>';

  if (state.clients.length === 0) {
    return header +
      '<div style="margin-top:24px;max-width:520px;background:#EBE4D9;border:1px solid #DDD3C4;border-radius:10px;padding:20px 22px;">' +
      '<p style="color:#453E33;font-size:14px;">No clients yet.</p>' +
      '<p style="color:#5E564A;font-size:13px;margin-top:6px;">Add your first client with the button above — prospects you win move in here too.</p>' +
      '</div>';
  }

  var order = {};
  STAGES.forEach(function (s, i) { order[s] = i; });
  var clients = state.clients.slice().sort(function (a, b) {
    return (order[a.stage] || 0) - (order[b.stage] || 0);
  });

  var cards = clients.map(function (c) {
    var dormant = c.stage === 'Dormant';
    var lines = [];
    var contact = [c.contact, c.email, c.phone].filter(Boolean).map(esc).join(' · ');
    if (contact) lines.push('<div style="color:#5E564A;font-size:13px;margin-top:6px;">' + contact + '</div>');
    var deal = [c.lane, c.package, c.retainer ? 'Retainer' : ''].filter(Boolean).map(esc).join(' · ');
    if (deal) lines.push('<div style="color:#857A69;font-size:12px;margin-top:4px;">' + deal + '</div>');
    var terms = [];
    if (c.monthlyHours) terms.push(esc(String(c.monthlyHours)) + ' hrs a month');
    if (c.monthlyPieces) terms.push(esc(String(c.monthlyPieces)) + ' pieces a month');
    if (c.billingDay) terms.push('bills on day ' + esc(String(c.billingDay)));
    if (c.startDate) terms.push('started ' + fmtDate(c.startDate));
    if (terms.length) lines.push('<div style="color:#857A69;font-size:12px;margin-top:4px;">' + terms.join(' · ') + '</div>');
    var links = [];
    if (c.website) links.push(extLink(c.website, 'Website'));
    if (c.instagram) links.push(extLink(/^@/.test(c.instagram) ? 'instagram.com/' + c.instagram.slice(1) : c.instagram, 'Instagram'));
    if (c.driveLink) links.push(extLink(c.driveLink, 'Drive folder'));
    links.push('<button data-dl-clientfile="' + esc(c.business) + '" style="padding:1px 10px;font-family:Arial,sans-serif;font-size:12px;border:1px solid #C4B8A8;border-radius:6px;background:#F7F3EC;color:#5E564A;cursor:pointer;">Download client file</button>');
    lines.push('<div style="display:flex;align-items:center;gap:14px;margin-top:8px;">' + links.join('') + '</div>');
    if (c.notes) lines.push('<div style="color:#857A69;font-size:12px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(c.notes) + '</div>');

    return '<div data-client="' + esc(c.id) + '" style="background:#EBE4D9;border:1px solid #DDD3C4;border-radius:10px;padding:16px 18px;cursor:pointer;' + (dormant ? 'opacity:0.65;' : '') + '">' +
      '<div style="display:flex;align-items:baseline;gap:10px;">' +
      '<div style="flex:1;font-family:Georgia,serif;font-size:18px;color:#453E33;">' + esc(c.business) + '</div>' +
      stageChip(c.stage) + '</div>' + lines.join('') + '</div>';

/* Custom mix calculator — prices in-between quantities from the ladders.
   Video ladder €120(1)/€320(3)/€500(5)/€760(8); hours €195(5)/€370(10)/
   €700(20)/€960(30). Between rungs: straight-line interpolation. Below the
   first rung: the first rung's unit rate. Above the top rung: the top run
   of the ladder's marginal rate. */
var customMix = { videos: 0, hours: 0, added: false };
var VIDEO_RUNGS = [[1, 120], [3, 320], [5, 500], [8, 760]];
var HOUR_RUNGS = [[5, 195], [10, 370], [20, 700], [30, 960]];

function ladderPrice(rungs, qty, underRate, overRate) {
  if (qty <= 0) return 0;
  if (qty <= rungs[0][0]) return qty * underRate;
  var top = rungs[rungs.length - 1];
  if (qty >= top[0]) return top[1] + (qty - top[0]) * overRate;
  for (var i = 0; i < rungs.length - 1; i++) {
    var a = rungs[i], b = rungs[i + 1];
    if (qty > a[0] && qty <= b[0]) {
      return a[1] + (b[1] - a[1]) * (qty - a[0]) / (b[0] - a[0]);
    }
  }
  return 0;
}

function round5(x) { return Math.round(x / 5) * 5; }
function videosPrice(n) { return round5(ladderPrice(VIDEO_RUNGS, n, 120, (760 - 500) / 3)); }
function hoursPrice(h) { return round5(ladderPrice(HOUR_RUNGS, h, 39, 32)); }

/* Duo saving scales like the menu: €55 off €515 (~11%) up to €290 off €1,460 (~20%) */
function duoPct(separate) {
  var pct = 10.7 + (separate - 515) * (19.9 - 10.7) / (1460 - 515);
  return Math.max(10.7, Math.min(19.9, pct));
}

function customTotalFor(mix) {
  var v = videosPrice(mix.videos || 0);
  var h = hoursPrice(mix.hours || 0);
  var sep = v + h;
  if (mix.videos > 0 && mix.hours > 0) return round5(sep * (1 - duoPct(sep) / 100));
  return sep;
}

function customTotal() { return customTotalFor(customMix); }

/* ─── Downloads: branded PDFs (HTML fallback when jsPDF can't load) ─────── */
function norm(s) { return String(s || '').trim().toLowerCase(); }

function docToPdf(blocks) {
  if (!window.jspdf || !window.jspdf.jsPDF) return null;
  var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
  var W = 595.28, M = 56, y = 0, page = 1;
  function header() {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(133, 122, 105); doc.setCharSpace(2);
    doc.text('THE SUEDE STUDIO', M, 40);
    doc.setCharSpace(0);
    doc.setDrawColor(196, 184, 168); doc.setLineWidth(0.7); doc.line(M, 48, W - M, 48);
    y = 76;
  }
  function foot() {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(133, 122, 105);
    doc.text('thesuedestudio.com · @the.suede.studio', M, 812);
    doc.text(String(page), W - M, 812, { align: 'right' });
  }
  function newPage() { foot(); doc.addPage(); page++; header(); }
  function need(h) { if (y + h > 786) newPage(); }
  header();
  blocks.forEach(function (b) {
    if (b.t === 'pagebreak') { newPage(); return; }
    if (b.t === 'gap') { y += 10; return; }
    if (b.t === 'h1') {
      need(44); doc.setFont('times', 'normal'); doc.setFontSize(23); doc.setTextColor(69, 62, 51);
      doc.text(b.x, M, y + 23); y += 38; return;
    }
    if (b.t === 'h2') {
      need(40); y += 12; doc.setFont('times', 'normal'); doc.setFontSize(15); doc.setTextColor(69, 62, 51);
      doc.text(b.x, M, y + 15); y += 22;
      doc.setDrawColor(221, 211, 196); doc.setLineWidth(0.6); doc.line(M, y, W - M, y); y += 10; return;
    }
    if (b.t === 'row') {
      need(18); doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(69, 62, 51);
      doc.text(b.k, M, y + 10);
      if (b.v) { doc.setFont('helvetica', 'normal'); doc.text(b.v, W - M, y + 10, { align: 'right' }); }
      y += 14;
      if (b.d) {
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(133, 122, 105);
        var dl = doc.splitTextToSize(b.d, W - 2 * M - 40);
        need(dl.length * 11 + 4); doc.text(dl, M, y + 9); y += dl.length * 11 + 5;
      } else { y += 3; }
      return;
    }
    if (b.t === 'kv') {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
      var kl = doc.splitTextToSize(String(b.v), W - 2 * M - 140);
      need(Math.max(1, kl.length) * 13 + 4);
      doc.setFont('helvetica', 'bold'); doc.setTextColor(94, 86, 74); doc.text(b.k, M, y + 10);
      doc.setFont('helvetica', 'normal'); doc.setTextColor(69, 62, 51); doc.text(kl, M + 140, y + 10);
      y += Math.max(1, kl.length) * 13 + 4; return;
    }
    /* p / li / note */
    var size = b.t === 'note' ? 9 : 10.5;
    var col = b.t === 'note' ? [133, 122, 105] : [69, 62, 51];
    doc.setFont('helvetica', 'normal'); doc.setFontSize(size); doc.setTextColor(col[0], col[1], col[2]);
    var prefix = b.t === 'li' ? '•  ' : '';
    var lines = doc.splitTextToSize(prefix + b.x, W - 2 * M - (b.t === 'li' ? 8 : 0));
    need(lines.length * 13 + 4);
    doc.text(lines, M + (b.t === 'li' ? 6 : 0), y + 11);
    y += lines.length * 13 + (b.t === 'note' ? 4 : 6);
  });
  foot();
  return doc.output('blob');
}

function docToHtml(blocks, title) {
  var out = ['<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title></head>' +
    '<body style="font-family:Arial,sans-serif;color:#453E33;background:#F7F3EC;margin:0;padding:40px 20px;">' +
    '<div style="max-width:640px;margin:0 auto;background:#F7F3EC;">' +
    '<div style="font-size:11px;letter-spacing:2px;color:#857A69;font-weight:bold;">THE SUEDE STUDIO</div>' +
    '<hr style="border:none;border-top:1px solid #C4B8A8;margin:10px 0 24px;">'];
  blocks.forEach(function (b) {
    if (b.t === 'h1') out.push('<h1 style="font-family:Georgia,serif;font-weight:normal;font-size:28px;margin:8px 0;">' + esc(b.x) + '</h1>');
    else if (b.t === 'h2') out.push('<h2 style="font-family:Georgia,serif;font-weight:normal;font-size:19px;margin:22px 0 6px;padding-bottom:6px;border-bottom:1px solid #DDD3C4;">' + esc(b.x) + '</h2>');
    else if (b.t === 'p') out.push('<p style="font-size:14px;margin:8px 0;">' + esc(b.x) + '</p>');
    else if (b.t === 'note') out.push('<p style="font-size:12px;color:#857A69;margin:6px 0;">' + esc(b.x) + '</p>');
    else if (b.t === 'li') out.push('<p style="font-size:14px;margin:5px 0 5px 16px;">• ' + esc(b.x) + '</p>');
    else if (b.t === 'kv') out.push('<p style="font-size:13px;margin:5px 0;"><b style="color:#5E564A;">' + esc(b.k) + ':</b> ' + esc(b.v) + '</p>');
    else if (b.t === 'row') out.push('<div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;margin:6px 0 2px;"><b>' + esc(b.k) + '</b><span>' + esc(b.v || '') + '</span></div>' + (b.d ? '<p style="font-size:12px;color:#857A69;margin:0 0 6px;">' + esc(b.d) + '</p>' : ''));
    else if (b.t === 'pagebreak') out.push('<hr style="border:none;border-top:1px solid #C4B8A8;margin:30px 0;">');
  });
  out.push('</div></body></html>');
  return out.join('');
}

function fallbackDownload(filename, data) {
  try {
    var blob = data instanceof Blob ? data : new Blob([data], { type: /\.html$/.test(filename) ? 'text/html' : 'application/pdf' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  } catch (e) {}
}

/* In the claude.ai artifact viewer, downloads go through the runtime's save
   prompt; everywhere else (GitHub Pages, a local file) a plain browser
   download does the job. */
function saveFile(filename, data) {
  var cap = Promise.resolve(null);
  if (window.claude && typeof window.claude.use === 'function') {
    cap = window.claude.use('downloads').catch(function () { return null; });
  }
  cap.then(function (dl) {
    if (dl) {
      dl.save({ filename: filename, data: data }).catch(function (err) {
        if (err && (err.code === 'declined' || err.code === 'rate_limited')) return;
        fallbackDownload(filename, data);
      });
      return;
    }
    fallbackDownload(filename, data);
  });
}

function downloadDoc(name, blocks) {
  /* Chromium drops non-ASCII suggested filenames, so keep them plain */
  var fname = name.replace(/[—–]/g, '-').replace(/[^A-Za-z0-9 ._()-]/g, '').replace(/\s+/g, ' ').trim();
  var pdf = docToPdf(blocks);
  if (pdf) saveFile(fname + '.pdf', pdf);
  else saveFile(fname + '.html', docToHtml(blocks, name));
}

var gForm = null; /* { type, id } while the generic modal is open */

function fieldHtml(f, value) {
  var labelStyle = 'display:block;font-size:13px;color:#5E564A;margin:12px 0 4px;';
  var inputStyle = 'width:100%;padding:8px 10px;font-family:Arial,sans-serif;font-size:14px;border:1px solid #C4B8A8;border-radius:6px;background:#FFFCF5;color:#453E33;outline:none;';
  var v = value == null ? '' : value;
  if (f.type === 'check') {
    return '<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#5E564A;margin:14px 0 2px;cursor:pointer;">' +
      '<input type="checkbox" data-f="' + f.k + '"' + (v ? ' checked' : '') + '> ' + f.label + '</label>';
  }
  if (f.type === 'select') {
    var opts = f.options.map(function (o) {
      return '<option value="' + esc(o) + '"' + (v === o ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join('');
    return '<label style="' + labelStyle + '">' + f.label + '</label><select data-f="' + f.k + '" style="' + inputStyle + '">' + opts + '</select>';
  }
  if (f.type === 'textarea') {
    return '<label style="' + labelStyle + '">' + f.label + '</label><textarea data-f="' + f.k + '" style="' + inputStyle + 'resize:vertical;min-height:64px;">' + esc(v) + '</textarea>';
  }
  var type = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
  return '<label style="' + labelStyle + '">' + f.label + '</label><input type="' + type + '" data-f="' + f.k + '" value="' + esc(v) + '" style="' + inputStyle + '">';
}

function openForm(type, id, presets) {
  var spec = FORM_SPECS[type];
  var record = null;
  if (id) {
    var arr = state[spec.store];
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) record = arr[i];
  }
  gForm = { type: type, id: id || null };
  document.getElementById('g-title').textContent = record ? spec.titleEdit : spec.titleNew;

  var html = '', pending = null;
  spec.fields.forEach(function (f) {
    var v = record ? record[f.k] : (presets && presets[f.k] != null ? presets[f.k] : (f.type === 'select' ? f.options[0] : ''));
    var piece = '<div style="flex:1;min-width:0;">' + fieldHtml(f, v) + '</div>';
    if (f.half) {
      if (pending) { html += '<div style="display:flex;gap:12px;">' + pending + piece + '</div>'; pending = null; }
      else pending = piece;
    } else {
      if (pending) { html += '<div style="display:flex;gap:12px;">' + pending + '</div>'; pending = null; }
      html += fieldHtml(f, v);
    }
  });
  if (pending) html += '<div style="display:flex;gap:12px;">' + pending + '</div>';

  document.getElementById('g-body').innerHTML = html;
  document.getElementById('g-delete').style.display = record ? '' : 'none';
  document.getElementById('modal-backdrop').style.display = 'block';
  document.getElementById('gmodal').style.display = 'block';
  var firstInput = document.querySelector('#g-body [data-f]');
  if (firstInput) firstInput.focus();
}

function closeForm() {
  gForm = null;
  document.getElementById('modal-backdrop').style.display = 'none';
  document.getElementById('gmodal').style.display = 'none';
}

document.getElementById('g-save').addEventListener('click', function () {
  if (!gForm) return;
  var spec = FORM_SPECS[gForm.type];
  var values = {};
  var inputs = document.querySelectorAll('#g-body [data-f]');
  for (var i = 0; i < inputs.length; i++) {
    var el = inputs[i], k = el.getAttribute('data-f');
    if (el.type === 'checkbox') values[k] = el.checked;
    else if (el.type === 'number') values[k] = el.value === '' ? null : parseFloat(el.value);
    else values[k] = el.value.trim() || (el.tagName === 'SELECT' ? el.value : '');
  }
  if (spec.required && !values[spec.required]) {
    var req = document.querySelector('#g-body [data-f="' + spec.required + '"]');
    if (req) { req.style.borderColor = '#A85560'; req.focus(); }
    return;
  }
  /* Prep forms create dated tasks on the board instead of a record */
  if (gForm.type === 'shootprep' || gForm.type === 'ecomprep') {
    var day = values.day || todayStr();
    var defs = gForm.type === 'shootprep' ? shootPrepTasks(values.client, day) : ecomPlanTasks(values.client, day);
    defs.forEach(function (d, di) {
      state.tasks.push({
        id: 'prep-' + Date.now() + '-' + di,
        title: d[0], owner: d[1], client: values.client, priority: d[2], due: d[3],
        notes: gForm.type === 'shootprep' ? 'Shoot prep' : 'Work plan',
        status: 'todo', doneDate: null
      });
    });
    closeForm();
    saveState(state);
    location.hash = '#/tasks';
    render();
    return;
  }
  /* Saving a selection snapshots the current picker; same client name = update */
  if (gForm.type === 'selection' && !gForm.id) {
    values.items = Object.keys(quoteSel);
    values.custom = { videos: customMix.videos, hours: customMix.hours, added: customMix.added };
    values.savedAt = todayStr();
    var match = null;
    for (var m = 0; m < state.selections.length; m++) {
      if (state.selections[m].client.toLowerCase() === values.client.toLowerCase()) match = state.selections[m];
    }
    if (match) {
      Object.assign(match, values);
      closeForm();
      persistAndRender();
      return;
    }
  }
  var arr = state[spec.store];
  if (gForm.id) {
    for (var j = 0; j < arr.length; j++) if (arr[j].id === gForm.id) Object.assign(arr[j], values);
  } else {
    arr.push(Object.assign({ id: gForm.type + '-' + Date.now() + '-' + Math.floor(Math.random() * 1000) }, values));
  }
  closeForm();
  persistAndRender();
});

document.getElementById('g-cancel').addEventListener('click', closeForm);
document.getElementById('g-delete').addEventListener('click', function () {
  if (!gForm || !gForm.id) return;
  var arr = state[FORM_SPECS[gForm.type].store];
  for (var i = 0; i < arr.length; i++) if (arr[i].id === gForm.id) { arr.splice(i, 1); break; }
  closeForm();
  persistAndRender();
});

/* ─── Task board interactions ───────────────────────────────────────────── */
var dragId = null;
var suppressClick = false;

function persistAndRender() {
  saveState(state);
  render();
}

function setStatus(t, status) {
  if (t.status === status) return;
  t.status = status;
  if (status === 'done') t.doneDate = todayStr();
  else t.doneDate = null;
}

/* Move task in the array: before targetId, or to the end (renders last in its
   group). Array order is the manual order — never auto-sorted. */
function repositionTask(id, beforeId) {
  var idx = state.tasks.findIndex(function (t) { return t.id === id; });
  if (idx === -1) return;
  var task = state.tasks.splice(idx, 1)[0];
  if (beforeId) {
    var at = state.tasks.findIndex(function (t) { return t.id === beforeId; });
    if (at === -1) state.tasks.push(task);
    else state.tasks.splice(at, 0, task);
  } else {
    state.tasks.push(task);
  }
}

function clearDropMarkers() {
  var cards = document.querySelectorAll('[data-card]');
  for (var i = 0; i < cards.length; i++) cards[i].style.boxShadow = '';
  var zones = document.querySelectorAll('[data-drop]');
  for (var j = 0; j < zones.length; j++) zones[j].style.background = '';
}

document.getElementById('main').addEventListener('dragstart', function (e) {
  var card = e.target.closest ? e.target.closest('[data-card]') : null;
  if (!card) return;
  dragId = card.getAttribute('data-card');
  suppressClick = true;
  card.style.opacity = '0.45';
  if (e.dataTransfer) {
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
  }
});

document.getElementById('main').addEventListener('dragend', function () {
  dragId = null;
  clearDropMarkers();
  render();
  setTimeout(function () { suppressClick = false; }, 0);
});

document.getElementById('main').addEventListener('dragover', function (e) {
  if (!dragId) return;
  var card = e.target.closest ? e.target.closest('[data-card]') : null;
  var zone = e.target.closest ? e.target.closest('[data-drop]') : null;
  var colwrap = e.target.closest ? e.target.closest('[data-colwrap]') : null;
  if (!card && !zone && !colwrap) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  clearDropMarkers();
  if (card && card.getAttribute('data-card') !== dragId) {
    card.style.boxShadow = '0 -3px 0 0 #6E5B44';
  } else if (zone) {
    zone.style.background = '#DDD3C4';
  }
});

document.getElementById('main').addEventListener('drop', function (e) {
  if (!dragId) return;
  var task = findTask(dragId);
  if (!task) return;
  e.preventDefault();

  var card = e.target.closest ? e.target.closest('[data-card]') : null;
  var zone = e.target.closest ? e.target.closest('[data-drop]') : null;
  var colwrap = e.target.closest ? e.target.closest('[data-colwrap]') : null;

  if (card && card.getAttribute('data-card') !== dragId) {
    var beforeId = card.getAttribute('data-card');
    var target = findTask(beforeId);
    setStatus(task, target.status);
    repositionTask(task.id, beforeId);
  } else if (zone) {
    setStatus(task, zone.getAttribute('data-col'));
    repositionTask(task.id, null);
  } else if (colwrap) {
    setStatus(task, colwrap.getAttribute('data-colwrap'));
    repositionTask(task.id, null);
  } else {
    return;
  }
  dragId = null;
  persistAndRender();
});

/* Custom mix inputs — live maths on every keystroke, full re-render on blur
   so the quote bar catches up without stealing focus mid-typing */
document.getElementById('main').addEventListener('input', function (e) {
  var f = e.target.closest ? e.target.closest('[data-custom]') : null;
  if (!f) return;
  var v = Math.max(0, Math.floor(parseFloat(f.value) || 0));
  customMix[f.getAttribute('data-custom')] = v;
  var box = document.getElementById('custom-result');
  if (box) box.innerHTML = customResultHtml();
});
document.getElementById('main').addEventListener('change', function (e) {
  if (e.target.closest && e.target.closest('[data-custom]') && customMix.added) render();
});

/* Card hover — pale blue border, set inline so no class is involved */
document.getElementById('main').addEventListener('mouseover', function (e) {
  var card = e.target.closest ? e.target.closest('[data-card]') : null;
  if (card && !isOverdue(findTask(card.getAttribute('data-card')) || {})) {
    card.style.borderColor = '#B8DFFF';
  }
});
document.getElementById('main').addEventListener('mouseout', function (e) {
  var card = e.target.closest ? e.target.closest('[data-card]') : null;
  if (card && !isOverdue(findTask(card.getAttribute('data-card')) || {})) {
    card.style.borderColor = '#DDD3C4';
  }
});

document.getElementById('main').addEventListener('click', function (e) {
  var tick = e.target.closest ? e.target.closest('[data-tick]') : null;
  if (tick) {
    var t = findTask(tick.getAttribute('data-tick'));
    if (t) { setStatus(t, 'done'); persistAndRender(); }
    return;
  }
  if (e.target.closest && e.target.closest('[data-add-task]')) {
    openModal(null);
    return;
  }
  var pill = e.target.closest ? e.target.closest('[data-filter]') : null;
  if (pill) {
    taskFilter = pill.getAttribute('data-filter');
    render();
    return;
  }
  if (e.target.closest && e.target.closest('[data-start-onb]')) { openForm('onboard', null); return; }
  var onbStep = e.target.closest ? e.target.closest('[data-onb-step]') : null;
  if (onbStep) {
    var parts = onbStep.getAttribute('data-onb-step').split(':');
    for (var oi = 0; oi < state.onboardings.length; oi++) {
      if (state.onboardings[oi].id === parts[0]) {
        var o = state.onboardings[oi];
        if (!o.steps) o.steps = [];
        o.steps[parseInt(parts[1], 10)] = !o.steps[parseInt(parts[1], 10)];
        persistAndRender();
        return;
      }
    }
    return;
  }
  var makeClient = e.target.closest ? e.target.closest('[data-onb-makeclient]') : null;
  if (makeClient) {
    for (var mi = 0; mi < state.onboardings.length; mi++) {
      if (state.onboardings[mi].id === makeClient.getAttribute('data-onb-makeclient')) {
        var ob = state.onboardings[mi];
        if (!state.clients.some(function (c) { return norm(c.business) === norm(ob.client); })) {
          var fromProspect = null;
          state.prospects.forEach(function (x) { if (norm(x.business) === norm(ob.client) || norm(x.name) === norm(ob.client)) fromProspect = x; });
          state.clients.push({
            id: 'client-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
            business: ob.client,
            contact: fromProspect ? fromProspect.name : '',
            stage: 'Onboarding',
            notes: fromProspect && fromProspect.notes ? fromProspect.notes : ''
          });
          persistAndRender();
        }
        return;
      }
    }
    return;
  }
  var dlClient = e.target.closest ? e.target.closest('[data-dl-clientfile]') : null;
  if (dlClient) {
    var biz = dlClient.getAttribute('data-dl-clientfile');
    downloadDoc(biz + ' — client file', docClientFile(biz));
    return;
  }
  var dlDeck = e.target.closest ? e.target.closest('[data-dl-deck]') : null;
  if (dlDeck) {
    var which = dlDeck.getAttribute('data-dl-deck');
    if (which === 'who') downloadDoc('The Suede Studio — who we are', docWho());
    else if (which === 'process') downloadDoc('The Suede Studio — how onboarding works', docProcess());
    else if (which === 'expect') downloadDoc('The Suede Studio — what to expect from the work', docExpect());
    else if (which === 'packages') downloadDoc('The Suede Studio — packages and pricing', docPackages());
    else if (which === 'paperwork') downloadDoc('The Suede Studio — what you sign and get', docPaperwork());
    else downloadDoc('The Suede Studio — onboarding pack', docPack());
    return;
  }
  var onbEdit = e.target.closest ? e.target.closest('[data-onb-edit]') : null;
  if (onbEdit) { openForm('onboard', onbEdit.getAttribute('data-onb-edit')); return; }
  var pkCard = e.target.closest ? e.target.closest('[data-pk]') : null;
  if (pkCard) {
    var pk = pkCard.getAttribute('data-pk');
    if (quoteSel[pk]) delete quoteSel[pk]; else quoteSel[pk] = true;
    render();
    return;
  }
  if (e.target.closest && e.target.closest('[data-custom-add]')) {
    customMix.added = !customMix.added;
    render();
    return;
  }
  var prep = e.target.closest ? e.target.closest('[data-prep]') : null;
  if (prep) {
    openForm(prep.getAttribute('data-prep') === 'shoot' ? 'shootprep' : 'ecomprep', null, { day: addDays(todayStr(), 7) });
    return;
  }
  if (e.target.closest && e.target.closest('[data-save-selection]')) { openForm('selection', null); return; }
  var selLoad = e.target.closest ? e.target.closest('[data-sel-load]') : null;
  if (selLoad) {
    for (var si = 0; si < state.selections.length; si++) {
      if (state.selections[si].id === selLoad.getAttribute('data-sel-load')) {
        var sSel = state.selections[si];
        quoteSel = {};
        (sSel.items || []).forEach(function (k) { quoteSel[k] = true; });
        var cmm = sSel.custom || {};
        customMix = { videos: cmm.videos || 0, hours: cmm.hours || 0, added: !!cmm.added };
        render();
        return;
      }
    }
    return;
  }
  var selCard = e.target.closest ? e.target.closest('[data-selcard]') : null;
  if (selCard) { openForm('selection', selCard.getAttribute('data-selcard')); return; }
  if (e.target.closest && e.target.closest('[data-quote-clear]')) {
    quoteSel = {};
    customMix.added = false;
    render();
    return;
  }
  if (e.target.closest && e.target.closest('[data-add-client]')) { openForm('client', null); return; }
  if (e.target.closest && e.target.closest('[data-add-prospect]')) { openForm('prospect', null, { firstContact: todayStr(), lastContact: todayStr() }); return; }
  var pview = e.target.closest ? e.target.closest('[data-pview]') : null;
  if (pview) { prospectView = pview.getAttribute('data-pview'); render(); return; }
  if (e.target.closest && e.target.closest('[data-dl-csv]')) {
    saveFile('The Suede Studio - prospects.csv', prospectsCsv());
    return;
  }
  if (e.target.closest && e.target.closest('[data-add-content]')) { openForm('content', null, { date: todayStr() }); return; }
  if (e.target.closest && e.target.closest('[data-month-prev]')) { shiftContentMonth(-1); render(); return; }
  if (e.target.closest && e.target.closest('[data-month-next]')) { shiftContentMonth(1); render(); return; }
  if (e.target.tagName === 'A') return; /* let card links open normally */
  var clientCard = e.target.closest ? e.target.closest('[data-client]') : null;
  if (clientCard) { openForm('client', clientCard.getAttribute('data-client')); return; }
  var prospectRow = e.target.closest ? e.target.closest('[data-prospect]') : null;
  if (prospectRow) { openForm('prospect', prospectRow.getAttribute('data-prospect')); return; }
  var contentEntry = e.target.closest ? e.target.closest('[data-content-entry]') : null;
  if (contentEntry) { openForm('content', contentEntry.getAttribute('data-content-entry')); return; }
  var dayCell = e.target.closest ? e.target.closest('[data-day]') : null;
  if (dayCell) { openForm('content', null, { date: dayCell.getAttribute('data-day') }); return; }
  if (suppressClick) return;
  var card = e.target.closest ? e.target.closest('[data-card]') : null;
  if (card) openModal(card.getAttribute('data-card'));
});

var editingId = null;

function openModal(id) {
  editingId = id;
  var t = id ? findTask(id) : null;
  document.getElementById('modal-title').textContent = t ? 'Edit task' : 'Add a task';
  document.getElementById('f-title').value = t ? t.title : '';
  document.getElementById('f-owner').value = t ? t.owner : 'Elva';
  document.getElementById('f-priority').value = t ? t.priority : 'P2';
  document.getElementById('f-client').value = t && t.client ? t.client : '';
  document.getElementById('f-due').value = t && t.due ? t.due : '';
  document.getElementById('f-notes').value = t && t.notes ? t.notes : '';
  document.getElementById('f-delete').style.display = t ? '' : 'none';
  document.getElementById('modal-backdrop').style.display = 'block';
  document.getElementById('modal').style.display = 'block';
  document.getElementById('f-title').focus();
}

function closeModal() {
  editingId = null;
  document.getElementById('modal-backdrop').style.display = 'none';
  document.getElementById('modal').style.display = 'none';
}

document.getElementById('f-save').addEventListener('click', function () {
  var title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }
  var fields = {
    title: title,
    owner: document.getElementById('f-owner').value,
    priority: document.getElementById('f-priority').value,
    client: document.getElementById('f-client').value.trim() || null,
    due: document.getElementById('f-due').value || null,
    notes: document.getElementById('f-notes').value.trim()
  };
  if (editingId) {
    var t = findTask(editingId);
    if (t) Object.assign(t, fields);
  } else {
    state.tasks.push(Object.assign({
      id: 't-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
      status: 'todo',
      doneDate: null
    }, fields));
  }
  closeModal();
  persistAndRender();
});

document.getElementById('f-cancel').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', function () {
  closeModal();
  closeForm();
});

document.getElementById('f-delete').addEventListener('click', function () {
  if (!editingId) return;
  var idx = state.tasks.findIndex(function (t) { return t.id === editingId; });
  if (idx !== -1) state.tasks.splice(idx, 1);
  closeModal();
  persistAndRender();
});

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('modal').style.display === 'block') closeModal();
  if (document.getElementById('gmodal').style.display === 'block') closeForm();
});

/* ─── Password gate ─────────────────────────────────────────────────────── */
function openApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').className = 'open';
  render();
}

function tryPassword() {
  /* Light gate — forgive case and stray spaces from phone keyboards */
  var val = document.getElementById('gate-input').value.trim().toUpperCase();
  if (val === 'TSS123') {
    try { sessionStorage.setItem('suede-auth', '1'); } catch (e) {}
    openApp();
  } else {
    document.getElementById('gate-error').textContent = 'That’s not it — try again.';
    document.getElementById('gate-input').value = '';
    document.getElementById('gate-input').focus();
  }
}

document.getElementById('gate-btn').addEventListener('click', tryPassword);
document.getElementById('gate-input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') tryPassword();
});

var authed = false;
try { authed = sessionStorage.getItem('suede-auth') === '1'; } catch (e) {}
if (authed) openApp();
else document.getElementById('gate-input').focus();
</script>
</body>
</html>
